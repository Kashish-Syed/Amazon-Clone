name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run the checks by hand from the Actions tab without pushing.
  workflow_dispatch:

# A new push to the same branch cancels the run already in progress. Without
# this, a busy branch queues up runs that are all testing stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies and fails if
      # the lockfile is out of step with package.json. `npm install` would
      # quietly resolve a different tree, which is how a build passes locally
      # and fails in CI.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      # WHY THIS STEP EXISTS
      #
      # Create React App inlines REACT_APP_* at BUILD time, and a missing one is
      # not a build error - webpack substitutes undefined and compiles happily.
      # Worse, GitHub renders an unset `vars.X` as an EMPTY STRING, and dotenv
      # treats an already-present empty value as "already set", so it will not
      # fall back to the committed .env. An unconfigured repository variable
      # therefore silently strips the real value out of the bundle.
      #
      # Left unchecked that produces a green pipeline shipping an artifact that
      # cannot reach Firebase or Stripe. Checking the variables here, before the
      # build, is more reliable than inspecting the compiled bundle afterwards:
      # config.js contains a hardcoded localhost fallback string that webpack
      # bundles either way, so the output cannot distinguish a real value from
      # the default.
      - name: Check required build variables are configured
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_PAYMENTS_API_URL: ${{ vars.REACT_APP_PAYMENTS_API_URL }}
        run: |
          missing=""

          for name in \
            REACT_APP_FIREBASE_API_KEY \
            REACT_APP_FIREBASE_AUTH_DOMAIN \
            REACT_APP_FIREBASE_PROJECT_ID \
            REACT_APP_FIREBASE_APP_ID \
            REACT_APP_STRIPE_PUBLISHABLE_KEY \
            REACT_APP_PAYMENTS_API_URL
          do
            if [ -z "$(printenv "$name")" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Add them under Settings > Secrets and variables > Actions > Variables."
            echo "All of these are public by design: the Firebase web config and the"
            echo "Stripe PUBLISHABLE key. Never add a Stripe secret key here."
            exit 1
          fi

          echo "All required build variables are set."

      # These are all public values - the Firebase web config and the Stripe
      # PUBLISHABLE key - so they are safe as repository variables. Nothing
      # secret belongs here; the Stripe secret key lives in Supabase and never
      # reaches the client bundle.
      - name: Build
        run: npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_PAYMENTS_API_URL: ${{ vars.REACT_APP_PAYMENTS_API_URL }}
          # Warnings fail the build. A warning nobody fails on is a warning
          # nobody reads.
          CI: true

      # Belt and braces: confirm the values actually reached the bundle. The
      # pre-build check proves the variables were set; this proves CRA inlined
      # them. Only values that cannot also appear as a hardcoded default are
      # worth asserting on here.
      - name: Verify configuration was inlined into the bundle
        run: |
          bundle=$(ls build/static/js/main.*.js 2>/dev/null | head -1)

          if [ -z "$bundle" ]; then
            echo "::error::No main bundle was produced."
            exit 1
          fi

          failed=0

          if ! grep -q 'firebaseapp\.com' "$bundle"; then
            echo "::error::Firebase authDomain did not reach the bundle."
            failed=1
          fi

          if ! grep -qE 'pk_(test|live)_' "$bundle"; then
            echo "::error::Stripe publishable key did not reach the bundle."
            failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "Firebase and Stripe configuration is present in the bundle."
          fi

          exit $failed

  secret-scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # A Stripe SECRET key was committed to this repo once already. This is a
      # cheap backstop, not a replacement for a real scanner: it only catches
      # the specific pattern we know has bitten us.
      - name: Reject Stripe secret keys
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               -E 'sk_(test|live)_[A-Za-z0-9]{20,}' .; then
            echo "::error::A Stripe secret key appears in the working tree."
            exit 1
          fi
          echo "No Stripe secret keys found."
